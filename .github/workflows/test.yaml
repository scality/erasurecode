name: Basic Tests

on:
  push:
    branches:
      - 'user/**'
      - 'feature/**'
      - 'improvement/**'
      - 'bugfix/**'
      - 'dependabot/**'
      - 'renovate/**'
      - 'w/**'
      - 'q/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    container: rockylinux:8.7
    env:
      GOLINT_VERSION: 1.64.8
      GO_VERSION: 1.23.0
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - uses: ./.github/workflows/installation
      - name: install deps
        run: |
          set -xvue
          go get -v -t -d ./...
      - name: build
        run: |
          set -xvue
          make
      - name: test
        run: |
          set -xvue
          make test
          make lint

